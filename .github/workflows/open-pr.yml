name: Open or update staging PR

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build commit list
        id: commits
        run: |
          git fetch origin main
          COMMITS=$(git log origin/main..HEAD --oneline --no-merges | head -50)
          {
            echo "list<<COMMIT_EOF"
            echo "$COMMITS"
            echo "COMMIT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const rawCommits = `${{ steps.commits.outputs.list }}`;
            const commitLines = rawCommits
              .split('\n')
              .map(l => l.trim())
              .filter(Boolean)
              .map(l => `- ${l}`)
              .join('\n');

            const body = [
              '## Live dev site',
              '',
              'https://dev.mikewest.dev',
              '',
              '## Commits in this diff',
              '',
              commitLines || '- (no commits ahead of main)',
            ].join('\n');

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:dev`,
              base: 'main',
            });

            if (prs.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prs[0].number,
                body,
              });
              core.info(`Updated PR #${prs[0].number}`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: 'Promote dev to production',
                head: 'dev',
                base: 'main',
                body,
              });
              core.info(`Created PR #${pr.number}`);
            }
